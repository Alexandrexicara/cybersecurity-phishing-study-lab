<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#08111f">
  <title>Confirmar acesso | Security Lab</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:20px}
    .confirm-card{width:min(100%,500px);padding:32px;background:#101d30;border:1px solid #29445a;border-radius:16px}
    .confirm-card h1{font-size:25px}.confirm-card p{color:#aabbd0;line-height:1.7;font-size:14px}
    .confirm-card a{display:inline-block;margin-top:14px;color:#54e0d0;font-weight:800}
    #confirm-status{color:#54e0d0}
  </style>
</head>
<body>
  <main class="confirm-card">
    <div class="auth-brand"><span class="brand-mark">◈</span><span>CYBER<span class="accent">LAB</span></span></div>
    <p class="eyebrow">AUTORIZAÇÃO DE ACESSO</p>
    <h1>Confirmar seu acesso</h1>
    <p id="confirm-status" role="status" aria-live="polite">Validando seu link individual...</p>
    <a href="./index.html">Ir para a tela de entrada</a>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("confirm-status");
      const token = new URLSearchParams(location.search).get("token") || "";
      history.replaceState(null, "", location.pathname);
      if (!token) {
        status.textContent = "Link ausente ou inválido. Solicite uma nova autorização.";
        return;
      }
      try {
        const response = await fetch("https://cybersecurity-phishing-study-lab.onrender.com/api/auth/confirm", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({token})
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Não foi possível confirmar o link.");
        status.textContent = data.message || "Acesso confirmado. Você já pode entrar.";
      } catch (error) {
        status.textContent = error.message;
      }
    })();
  </script>
</body>
</html>
